<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Gemini Chat</title>
    <style>
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: #fcfcfc; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #chat-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px 16px; border-radius: 12px; max-width: 85%; font-size: 15px; }
        .user { align-self: flex-end; background: #e8f0fe; color: #3c4043; }
        .ai { align-self: flex-start; background: #ffffff; border: 1px solid #dadce0; color: #202124; }
        #settings { padding: 10px 20px; background: #f1f3f4; display: flex; gap: 10px; align-items: center; font-size: 13px; }
        #input-area { padding: 20px; border-top: 1px solid #dadce0; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: 1px solid #dadce0; border-radius: 8px; outline: none; }
        button { padding: 10px 20px; background: #1a73e8; color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div id="settings">
    <span>API Key:</span>
    <input type="password" id="keyInput" placeholder="在此输入并保存 Key" style="flex:0; width: 200px;">
    <button onclick="saveKey()">保存</button>
</div>
<div id="chat-container"></div>
<div id="input-area">
    <input type="text" id="userInput" placeholder="输入对话...">
    <button onclick="sendMessage()">发送</button>
</div>

<script>
    const PROXY_URL = 'https://gproxy-xao4.vercel.app';
    
    // 初始化：从本地读取 Key
    document.getElementById('keyInput').value = localStorage.getItem('gemini_api_key') || '';

    function saveKey() {
        const key = document.getElementById('keyInput').value;
        localStorage.setItem('gemini_api_key', key);
        alert('API Key 已保存至本地浏览器');
    }

    async function sendMessage() {
        const key = localStorage.getItem('gemini_api_key');
        if (!key) { alert('请先输入并保存 API Key'); return; }

        const input = document.getElementById('userInput');
        const chat = document.getElementById('chat-container');
        const text = input.value.trim();
        if (!text) return;

        chat.innerHTML += `<div class="msg user">${text}</div>`;
        input.value = '';

        try {
            // 使用请求头传递 Key，比 URL 参数更安全
            const response = await fetch(`${PROXY_URL}/v1beta/models/gemini-1.5-flash:generateContent`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'x-api-key': key 
                },
                body: JSON.stringify({ contents: [{ parts: [{ text }] }] })
            });

            const data = await response.json();
            const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "解析失败，请检查 Key 是否有效。";
            chat.innerHTML += `<div class="msg ai">${aiText}</div>`;
        } catch (e) {
            chat.innerHTML += `<div class="msg ai" style="color:red">连接错误: ${e.message}</div>`;
        }
        chat.scrollTop = chat.scrollHeight;
    }
</script>
</body>
</html>
