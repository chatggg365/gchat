<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Gemini Interface</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f9f9f9; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #chat-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 12px 16px; border-radius: 12px; max-width: 85%; font-size: 15px; }
        .user { align-self: flex-end; background: #4a90e2; color: white; }
        .ai { align-self: flex-start; background: white; border: 1px solid #ddd; color: #333; }
        #settings { padding: 10px 20px; background: #eee; display: flex; gap: 10px; align-items: center; }
        #input-area { padding: 20px; border-top: 1px solid #ddd; display: flex; gap: 10px; background: white; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
        button { padding: 8px 16px; background: #4a90e2; color: white; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div id="settings">
    <input type="password" id="keyInput" placeholder="请输入你的 Gemini API Key">
    <button onclick="saveKey()">保存 Key</button>
</div>
<div id="chat-container"></div>
<div id="input-area">
    <input type="text" id="userInput" placeholder="发送消息...">
    <button onclick="sendMessage()">发送</button>
</div>

<script>
    // 你的 Vercel 中转站域名
    const PROXY_URL = 'https://gproxy-xao4.vercel.app';
    
    // 初始化读取
    document.getElementById('keyInput').value = localStorage.getItem('gemini_key') || '';

    function saveKey() {
        localStorage.setItem('gemini_key', document.getElementById('keyInput').value);
        alert('密钥已保存至浏览器本地。');
    }

    async function sendMessage() {
        const text = document.getElementById('userInput').value.trim();
        const key = localStorage.getItem('gemini_key');
        if (!key) { alert('请先输入并保存 API Key'); return; }
        if (!text) return;

        const chat = document.getElementById('chat-container');
        chat.innerHTML += `<div class="msg user">${text}</div>`;
        document.getElementById('userInput').value = '';

        try {
            // 按照 Astral719 项目的调用逻辑：通过 Header 传递 x-api-key
            const response = await fetch(`${PROXY_URL}/v1beta/models/gemini-1.5-flash:generateContent`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'x-api-key': key 
                },
                body: JSON.stringify({ contents: [{ parts: [{ text }] }] })
            });

            const data = await response.json();
            const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "请求失败，请检查 Vercel 环境变量 API_KEY 是否正确。";
            chat.innerHTML += `<div class="msg ai">${aiText}</div>`;
        } catch (e) {
            chat.innerHTML += `<div class="msg ai" style="color:red">错误: ${e.message}。请确保 Vercel 中转站运行正常。</div>`;
        }
        chat.scrollTop = chat.scrollHeight;
    }
</script>
</body>
</html>
