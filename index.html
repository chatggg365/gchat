<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Chat</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f4f9; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 12px 18px; border-radius: 15px; max-width: 80%; line-height: 1.5; }
        .user { background: #007bff; color: white; align-self: flex-end; }
        .ai { background: #e9e9eb; color: #333; align-self: flex-start; }
        #input-area { padding: 20px; background: white; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 25px; outline: none; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 25px; cursor: pointer; }
    </style>
</head>
<body>

<div id="chat-container"></div>
<div id="input-area">
    <input type="text" id="userInput" placeholder="输入内容...">
    <button onclick="sendMessage()">发送</button>
</div>

<script>
    // 你的 Vercel 中转站地址
    const PROXY_URL = 'https://gproxy-xao4.vercel.app'; 
    // 模型路径
    const API_PATH = '/v1beta/models/gemini-1.5-flash:generateContent';

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const chat = document.getElementById('chat-container');
        const text = input.value.trim();
        
        if (!text) return;

        // 显示用户消息
        chat.innerHTML += `<div class="message user">${text}</div>`;
        input.value = '';
        chat.scrollTop = chat.scrollHeight;

        try {
            const response = await fetch(`${PROXY_URL}${API_PATH}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: text }] }]
                })
            });

            const data = await response.json();
            
            // 解析 Gemini 的回复格式
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                const aiText = data.candidates[0].content.parts[0].text;
                chat.innerHTML += `<div class="message ai">${aiText}</div>`;
            } else {
                chat.innerHTML += `<div class="message ai">发生错误: ${JSON.stringify(data)}</div>`;
            }
        } catch (error) {
            chat.innerHTML += `<div class="message ai">请求失败，请检查网络或 Vercel 配置: ${error.message}</div>`;
        }
        chat.scrollTop = chat.scrollHeight;
    }
</script>

</body>
</html>
